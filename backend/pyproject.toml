[tool.poetry]
name = "book-rec"
version = "0.2.0"
description = ""
authors = ["Tuan Pham <tuanqpham0921@gmail.com>"]
packages = [
    { include = "airglider" },
    { include = "app" },
    { include = "clients" },
    { include = "common" },
    { include = "db" },
    { include = "config" }
]

[tool.pyright]
include = ["airglider", "app", "common", "clients", "config", "db"]
exclude = ["**/__pycache__"]
typeCheckingMode = "basic"
pythonVersion = "3.12"

[tool.pytest.ini_options]
asyncio_mode = "auto"
log_cli_level = "INFO"
log_cli = true
# airglider ships its tests beside its source (they move with the package when
# it is extracted); the app's own suites stay under tests/
testpaths = ["tests", "airglider/tests"]
markers = [
    "unit: fast, no I/O",
    "integration: cross-layer tests (whole API routes in-process; faked stores, no services)",
]

[tool.poetry.dependencies]
python = "^3.11"
tiktoken = "^0.9.0"
pydantic-settings = "^2.9.1"
pydantic = "^2.11.5"
rich = "^14.0.0"
openai = "^1.82.1"
fastapi = { extras = ["standard"], version = "^0.115.12" }
sse-starlette = "^2.3.6"
uvicorn = "^0.35.0"
pandas = "^2.3.2"
pgvector = ">=0.2.0"
asyncpg = "^0.29.0"
sqlalchemy = ">=2.0.0"
pyjwt = {version = "^2.10", extras = ["crypto"]}

[tool.poetry.group.dev.dependencies]
ipykernel = "^6.29.5"
pytest = "^8.0.0"
pytest-asyncio = "^0.23.0"
pytest-cov = "^7.0.0"
jupyter = "^1.1.1"
notebook = "^7.4.7"
ruff = "^0.15.20"
black = "^26.5.1"
pyright = "^1.1.411"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"