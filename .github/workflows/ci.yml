name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
      - dev

env:
  APP_NAME: book-shelf-backend
  APP_ENVIRONMENT: test
  APP_ALLOW_ORIGINS: http://localhost:3000

  POSTGRES_HOST: localhost
  POSTGRES_PORT: "5432"
  POSTGRES_DB: book_recommender_test
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: test_password
  POSTGRES_MIN_CONNECTIONS: "1"
  POSTGRES_MAX_CONNECTIONS: "5"
  
  OPENAI_API_KEY: test_key
  OPENAI_BASE_MODEL: gpt-4.1-mini
  OPENAI_TOKENIZER_ENCODING: o200k_base
  OPENAI_EMBEDDING_MODEL: text-embedding-3-large
  OPENAI_EMBEDDING_DIMENSIONS: "1024"
  OPENAI_MAX_CONCURRENCY: "1"

defaults:
  run:
    working-directory: backend

jobs:
  backend-unit-tests:
    name: Backend unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up backend
        uses: ./.github/actions/setup

      - name: Check Python syntax
        run: poetry run python -m compileall .

      - name: Run backend unit tests
        run: poetry run pytest tests/unit

      - name: Run backend integration tests
        run: poetry run pytest tests/integration

  frontend-build:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Catches a broken bundle before `make deploy` publishes it. Builds in
      # production mode, so it also proves .env.production parses.
      - name: Build
        run: npm run build